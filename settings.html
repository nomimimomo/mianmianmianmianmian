<div class="awm-extension-config extension_container">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <b>鲜虾鱼板面 V6.8</b>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
      <p>在酒馆中编辑角色、User、世界书与文风。</p>
      <button class="menu_button" type="button" data-mm-open>打开面板</button>
      <p data-mm-bridge-status class="awm-extension-status" role="status"></p>
      <label class="awm-extension-row"><span>显示悬浮按钮</span><input type="checkbox" data-mm-launcher-visible></label>
      <label class="awm-extension-row"><span>悬浮按钮大小 <output data-mm-size-label>56px</output></span><input type="range" min="32" max="120" step="1" data-mm-launcher-size></label>
      <button class="menu_button" type="button" data-mm-reset-launcher>找回悬浮按钮</button>
    </div>
  </div>
</div>
